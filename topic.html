function move(d){i=(i+d+T.items.length)%T.items.length;buildPicked=[];render();scrollTo({top:0,behavior:"smooth"})}
function dots(){return T.items.map((_,j)=>`<span class="dot ${j===i?"on":""}"></span>`).join("")}
function renderLesson(){let a=T.items[i];progress(i+1,T.items.length);panel.innerHTML=`<div class="topline"><h1>1. Sound & Blend 🔊</h1><div class="tag">${T.icon} ${T.title}</div></div><p class="instruction">Tap each sound, listen, then blend!</p><p class="vn">Bấm vào từng âm, nghe và sau đó ghép lại.</p><div class="showcase"><div class="picture">${a[1]}</div><div><div class="bigword">${a[2]}</div><div class="ipa">${a[3]}</div><button class="speaker" onclick="say('${a[2].toLowerCase()}')">🔊</button><div class="sentence"><b>${a[5]}</b><br>${a[4]}</div></div></div><div class="speedbox"><b>🔊 Voice:</b><button class="speedbtn ${speedMode==="slow"?"active":""}" onclick="setSpeed('slow')">🐢 Slow</button><button class="speedbtn ${speedMode==="normal"?"active":""}" onclick="setSpeed('normal')">Normal</button></div><div class="tiles">${a[6].map((z,j)=>`<div class="tile" onclick="sound(${j})"><div class="letter">${z[0]}</div><button class="speaker">🔊</button><div class="sound">${z[1]}</div></div>`).join("")}</div><button class="blend" onclick="blend()">🔊 BLEND!</button><div class="wordnav"><button class="btn pink" onclick="move(-1)">← Previous</button><button class="btn" onclick="move(1)">Next →</button></div><div class="dots">${dots()}</div>`}
function shuffledLetters(word){let a=word.split("").map((c,n)=>({c,n}));for(let j=a.length-1;j>0;j--){let k=Math.floor(Math.random()*(j+1));[a[j],a[k]]=[a[k],a[j]]}if(a.map(x=>x.c).join("")===word&&word.length>1)[a[0],a[1]]=[a[1],a[0]];return a}
let bank=[];
function renderBuild(reset=true){let a=T.items[i];progress(i+1,T.items.length);if(reset){buildPicked=[];bank=shuffledLetters(a[2])}panel.innerHTML=`<h1>2. Build the Word 🔤</h1><div class="tag">${T.icon} ${T.title}</div><p class="instruction">Put the letters in the right order.</p><p class="vn">Sắp xếp các chữ cái để tạo thành từ đúng.</p><div class="gamepic">${a[1]}</div><button class="speaker" onclick="say('${a[2].toLowerCase()}')">🔊</button><div class="buildslots">${a[2].split("").map((_,j)=>`<div class="slot" onclick="undoBuild()">${buildPicked[j]?.c||"_"}</div>`).join("")}</div><div class="buildbank">${bank.filter(x=>!buildPicked.some(p=>p.n===x.n)).map(x=>`<button class="letterchip" onclick="pickBuild(${x.n})">${x.c}</button>`).join("")}</div><div class="message" id="msg"></div><button class="btn pink" onclick="resetBuild()">↻ Mix again</button><div class="wordnav"><button class="btn" onclick="move(-1)">← Previous</button><button class="btn" onclick="move(1)">Next →</button></div>`}
function pickBuild(n){let x=bank.find(z=>z.n===n);if(!x)return;buildPicked.push(x);renderBuild(false);if(buildPicked.length===T.items[i][2].length){let made=buildPicked.map(x=>x.c).join("");let m=document.getElementById("msg");if(made===T.items[i][2]){m.textContent="🎉 Great job, Elsa!";score++;localStorage.setItem("elsaScore_"+key,score);say(T.items[i][2].toLowerCase())}else m.textContent="💛 Try again!"}}
function undoBuild(){buildPicked.pop();renderBuild(false)}function resetBuild(){buildPicked=[];bank=shuffledLetters(T.items[i][2]);renderBuild(false)}
function choicesFor(idx){let ans=T.items[idx],others=T.items.filter((_,j)=>j!==idx).sort(()=>Math.random()-.5).slice(0,3),all=[ans,...others].sort(()=>Math.random()-.5);return all}
let playChoices=[];
function renderPlay(newQ=true){if(newQ)playChoices=choicesFor(playIndex);let a=T.items[playIndex];progress(playIndex+1,T.items.length);panel.innerHTML=`<h1>3. Listen & Find 🎮</h1><div class="tag">${T.icon} ${T.title}</div><p class="instruction">Listen. Which picture is correct?</p><p class="vn">Nghe từ và chọn hình đúng.</p><button class="blend" onclick="say('${a[2].toLowerCase()}')">🔊 LISTEN</button><div class="choices">${playChoices.map(x=>`<button class="choice" onclick="answerPlay(this,'${x[2]}')"><span class="emo">${x[1]}</span>${x[2]}</button>`).join("")}</div><div class="message" id="msg"></div>`;setTimeout(()=>say(a[2].toLowerCase()),250)}
let audioCtx=null;
function tone(freq,start,dur,vol=.12){try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==="suspended")audioCtx.resume();let o=audioCtx.createOscillator(),g=audioCtx.createGain(),t=audioCtx.currentTime+start;o.type="sine";o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(audioCtx.destination);o.start(t);o.stop(t+dur+.03)}catch(e){}}
function correctSound(){tone(523.25,0,.16,.12);tone(659.25,.13,.18,.12);tone(783.99,.28,.30,.14)}
function wrongSound(){tone(329.63,0,.20,.08);tone(246.94,.20,.32,.07)}
function answerPlay(el,w){let ans=T.items[playIndex][2],m=document.getElementById("msg");if(w===ans){el.classList.add("good");m.textContent="⭐ Correct!";correctSound();score++;localStorage.setItem("elsaScore_"+key,score);setTimeout(()=>{playIndex=(playIndex+1)%T.items.length;renderPlay(true)},1200)}else{el.classList.add("bad");m.textContent="Try again 💛";wrongSound()}}
function renderReview(){progress(T.items.length,T.items.length);panel.innerHTML=`<h1>4. Review ⭐</h1><div class="tag">${T.icon} ${T.title}</div><p class="instruction">Review all 5 words.</p><p class="vn">Ôn lại 5 từ của chủ đề.</p>${T.items.map(a=>`<div class="reviewrow"><b>${a[1]} ${a[2]}</b> &nbsp; ${a[3]} — ${a[4]} <button class="speaker" onclick="say('${a[2].toLowerCase()}')">🔊</button><br><small>${a[5]}</small></div>`).join("")}<button class="btn green" onclick="showMode('sticker')">I finished! →</button>`}
function renderSticker(){progress(T.items.length,T.items.length);let earned=score>=3;panel.innerHTML=`<h1>5. Sticker 🎁</h1><div class="tag">${T.icon} ${T.title}</div>${earned?`<div class="sticker">🐬⭐</div><div class="badge">Amazing, Elsa! Topic completed!</div><p class="vn">Con đã hoàn thành bài học. Giỏi lắm!</p><div class="stars">⭐⭐⭐</div>`:`<div class="sticker">🎁</div><p class="instruction">Earn 3 stars to unlock your sticker!</p><p class="vn">Hoàn thành Build hoặc Play để nhận sticker nhé.</p><div class="stars">${"⭐".repeat(Math.min(score,3))}${"☆".repeat(Math.max(0,3-score))}</div><button class="btn" onclick="showMode('play')">🎮 Play now</button>`}`}
function render(){tabs();if(mode==="lesson")renderLesson();else if(mode==="build")renderBuild();else if(mode==="play")renderPlay();else if(mode==="review")renderReview();else renderSticker()}render();
</script></body></html>
