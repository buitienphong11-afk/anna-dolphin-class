<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Elsa's Word Adventure</title>
<style>*{box-sizing:border-box;touch-action:manipulation}body{margin:0;font-family:Trebuchet MS,Arial;background:linear-gradient(#c9f4ff,#fff7d5);color:#173f69}.app{max-width:950px;margin:auto;padding:16px}.top{display:flex;justify-content:space-between;align-items:center}.home{text-decoration:none;font-size:18px;font-weight:900;color:#15539a;background:white;padding:10px 14px;border-radius:20px}.stars{background:white;border-radius:22px;padding:9px 14px}.progress{height:12px;background:white;border-radius:20px;overflow:hidden;margin:12px 0 18px}.bar{height:100%;background:linear-gradient(90deg,#41c5ff,#ffd44f)}.card{display:none;background:#fffdf8;border:4px solid white;border-radius:30px;padding:24px;min-height:650px;text-align:center;box-shadow:0 12px 28px #246c9d20}.active{display:block}h1{font-size:clamp(34px,7vw,56px);color:#15539a}h2{font-size:clamp(27px,5vw,40px)}p{font-size:20px}.hero{font-size:100px}.word{font-size:clamp(42px,9vw,72px);font-weight:1000;letter-spacing:6px;color:#ff568e}.letters{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:22px 0}.letter{width:72px;height:72px;border:4px solid #bde9ff;border-radius:20px;background:white;font-size:42px;font-weight:1000;color:#15539a;display:flex;align-items:center;justify-content:center}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:13px;margin-top:20px}.tile{background:white;border:3px solid #c7eaff;border-radius:22px;padding:14px;min-height:125px;cursor:pointer}.name{font-size:24px;font-weight:900}.small{font-size:15px;color:#6b7d8e}button{border:0;border-radius:22px;padding:13px 20px;margin:7px;font-size:19px;font-weight:900;background:#1689d8;color:white;box-shadow:0 5px 0 #0e66a4}.pink{background:#ff79aa;box-shadow:0 5px 0 #d95787}.nav{display:flex;justify-content:space-between;margin-top:16px}.feedback{font-size:24px;font-weight:900;min-height:40px}@media(max-width:600px){.card{min-height:690px}.grid{grid-template-columns:repeat(2,1fr)}}</style></head><body><div class="app"><div class="top"><a class="home" href="index.html">⌂ Topics</a><div class="stars">⭐ <span id="score">0</span></div></div><div class="progress"><div class="bar" id="bar"></div></div>
<section class="card active"><div class="hero" id="hero"></div><h1 id="title"></h1><p>Hello, Elsa! Today: <b>sound → blend → word → meaning.</b></p><div class="grid" id="preview"></div><button onclick="next()">Let's start! 🚀</button></section>
<section class="card"><h2>1. Sound & Blend 🔤</h2><p>Do this for <b>every word</b>.</p><div class="hero" id="wordIcon">🔤</div><div class="word" id="word"></div><div class="letters" id="letters"></div><button onclick="blend()">🔊 BLEND!</button><div class="feedback" id="count"></div><button class="pink" onclick="prevWord()">← Word</button><button onclick="nextWord()">Next word →</button></section>
<section class="card"><h2>2. Listen & Repeat 👂</h2><p>Tap every word.</p><div class="grid" id="learn"></div><button onclick="playAll()">🔊 Play all slowly</button></section>
<section class="card"><h2>3. Find the Word 👀</h2><p id="question"></p><div class="grid" id="quiz"></div><div class="feedback" id="feedback"></div></section>
<section class="card"><div class="hero">🏆</div><h1>Great Job, Elsa!</h1><p>You finished this topic!</p><div class="grid" id="finish"></div><button onclick="playAll()">🔊 Say all words</button><br><a class="home" href="index.html">⌂ Choose another topic</a></section>
<div class="nav"><button class="pink" onclick="prev()">← Back</button><button onclick="next()">Next →</button></div></div>
<script>
const DATA={animals:{icon:'🐾',title:'Animals',words:['CAT', 'DOG', 'PIG', 'HEN', 'FOX']},toys:{icon:'🧸',title:'Toys',words:['BALL', 'DOLL', 'KITE', 'CAR', 'BLOCK']},food:{icon:'🍎',title:'Food',words:['APPLE', 'EGG', 'MILK', 'CAKE', 'RICE']},family:{icon:'👨‍👩‍👧',title:'Family',words:['MOM', 'DAD', 'BABY', 'SISTER', 'BROTHER']},body:{icon:'👀',title:'My Body',words:['EYE', 'EAR', 'NOSE', 'HAND', 'LEG']},home:{icon:'🏠',title:'My Home',words:['BED', 'DOOR', 'CHAIR', 'TABLE', 'CUP']},clothes:{icon:'👗',title:'Clothes',words:['HAT', 'SHOE', 'SOCK', 'DRESS', 'COAT']},transport:{icon:'🚗',title:'Transport',words:['CAR', 'BUS', 'VAN', 'BIKE', 'TRAIN']},nature:{icon:'🌳',title:'Nature',words:['SUN', 'SKY', 'TREE', 'LEAF', 'RAIN']},colors:{icon:'🌈',title:'Colors',words:['RED', 'BLUE', 'PINK', 'GREEN', 'BLACK']}};
let key=new URLSearchParams(location.search).get('t')||'animals',T=DATA[key]||DATA.animals,page=0,wi=0,score=0,voice=null;const cards=[...document.querySelectorAll('.card')];
function chooseVoice(){let v=speechSynthesis.getVoices();voice=v.find(x=>x.lang==='en-US'&&/Samantha|Ava|Allison|Susan|Zira|Jenny|Aria|Female/i.test(x.name))||v.find(x=>x.lang==='en-US')||v.find(x=>x.lang.startsWith('en'))||null}chooseVoice();speechSynthesis.onvoiceschanged=chooseVoice;
function utter(t,r=.56){return new Promise(ok=>{let u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=r;u.pitch=1.04;if(voice)u.voice=voice;u.onend=ok;u.onerror=ok;speechSynthesis.speak(u)})}function say(t){speechSynthesis.cancel();setTimeout(()=>utter(t),60)}
async function seq(xs,p=500){speechSynthesis.cancel();await new Promise(r=>setTimeout(r,70));for(let x of xs){await utter(x,.53);await new Promise(r=>setTimeout(r,p))}}
function renderWord(){let w=T.words[wi];word.textContent=w;count.textContent=(wi+1)+' / '+T.words.length;letters.innerHTML=[...w].map((L,i)=>'<div class="letter" onclick="sayLetter(\''+L+'\')">'+L+'</div>').join('')}
function sayLetter(L){say(L.toLowerCase())}async function blend(){let w=T.words[wi];await seq([...w].map(x=>x.toLowerCase()),350);await utter(w.toLowerCase(),.48)}
function nextWord(){if(wi<T.words.length-1){wi++;renderWord()}}function prevWord(){if(wi>0){wi--;renderWord()}}
function show(){cards.forEach((c,i)=>c.classList.toggle('active',i===page));bar.style.width=((page+1)/cards.length*100)+'%';scrollTo({top:0,behavior:'smooth'})}function next(){if(page<cards.length-1){page++;show()}}function prev(){if(page>0){page--;show()}}
function playAll(){seq(T.words.map(x=>x.toLowerCase()),700)}function answer(el,w){let ok=w===T.words[0];feedback.textContent=ok?'⭐ Yes! '+w+'!':'🙂 Try again!';say(ok?'Yes! '+w:'Try again');if(ok&&!el.dataset.done){el.dataset.done=1;score++;document.getElementById('score').textContent=score}}
hero.textContent=T.icon;title.textContent='Topic: '+T.title;preview.innerHTML=T.words.map(w=>'<div class="tile"><div class="name">'+w+'</div></div>').join('');learn.innerHTML=T.words.map(w=>'<div class="tile" onclick="say(\''+w.toLowerCase()+'\')"><div class="name">'+w+'</div><div class="small">🔊 Listen & repeat</div></div>').join('');finish.innerHTML=preview.innerHTML;question.textContent='Which word is “'+T.words[0].toLowerCase()+'”?';let opts=[T.words[2]||T.words[1],T.words[0],T.words[1]].filter(Boolean);quiz.innerHTML=opts.map(w=>'<div class="tile" onclick="answer(this,\''+w+'\')"><div class="name">'+w+'</div></div>').join('');renderWord();show();
</script></body></html>
