function voices(){let a=speechSynthesis.getVoices();voice=a.find(v=>v.lang==="en-US"&&/Samantha|Ava|Allison|Jenny|Aria|Zira|Susan|Female/i.test(v.name))||a.find(v=>v.lang==="en-US")||a.find(v=>v.lang.startsWith("en"))||null}voices();speechSynthesis.onvoiceschanged=voices;

function say(t){speechSynthesis.cancel();setTimeout(()=>utter(t),50)}function speakWord(){say(T.items[i][2].toLowerCase())}
